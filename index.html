<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nederlandse Verenigingen in Frankrijk – Evenementenkalender</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Mulish', sans-serif;
      color: #2a2a2a;
      background: #faf8f5;
      line-height: 1.8em;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* ── HEADER ── */
    .site-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 2px solid #800000;
    }
    .site-header h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.45rem;
      color: #800000;
      letter-spacing: -.02em;
      margin-bottom: 2px;
    }
    .site-header p {
      font-size: .85rem;
      color: #888;
    }
    .site-header .versie {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 7px;
      font-size: .68rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      background: rgba(128,0,0,.08);
      color: #800000;
      border-radius: 3px;
      letter-spacing: .02em;
    }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid #e8e0d8;
    }
    .tab-btn {
      padding: 10px 22px;
      border: none;
      background: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: .9rem;
      color: #999;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .2s, border-color .2s;
    }
    .tab-btn:hover { color: #800000; }
    .tab-btn.active {
      color: #800000;
      border-bottom-color: #800000;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── FILTERS ── */
    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-group {
      flex: 1;
      min-width: 150px;
    }
    .filter-group label {
      display: block;
      font-family: 'Poppins', sans-serif;
      font-size: .75rem;
      font-weight: 600;
      color: #800000;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .filter-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e8e0d8;
      border-radius: 6px;
      font-family: 'Mulish', sans-serif;
      font-size: .85rem;
      color: #2a2a2a;
      background: #fff;
      cursor: pointer;
      transition: border-color .2s;
    }
    .filter-group select:focus {
      outline: none;
      border-color: #800000;
      box-shadow: 0 0 0 2px rgba(128,0,0,.1);
    }

    /* ── MONTH GROUP ── */
    .month-group { margin-bottom: 16px; }
    .month-group h2 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: .95rem;
      color: #800000;
      padding: 4px 0;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(128,0,0,.12);
    }

    /* ── EVENT CARD ── */
    .event-card {
      display: flex;
      gap: 10px;
      padding: 7px 10px;
      margin-bottom: 3px;
      background: #fff;
      border: 1px solid #e8e0d8;
      border-radius: 5px;
      transition: border-color .2s, box-shadow .2s;
      align-items: center;
    }
    .event-card:hover {
      border-color: rgba(128,0,0,.25);
      box-shadow: 0 2px 8px rgba(128,0,0,.07);
    }

    /* ── DATE BADGE ── */
    .event-date {
      flex-shrink: 0;
      width: 42px;
      text-align: center;
      padding: 3px 0;
      background: rgba(128,0,0,.06);
      border-radius: 5px;
    }
    .event-date .day-name {
      display: block;
      font-size: .58rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1.1;
    }
    .event-date .day-num {
      display: block;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: #800000;
      line-height: 1.15;
    }
    .event-date .month-name {
      display: block;
      font-size: .58rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1.1;
    }

    /* ── CTA ontbrekende verenigingen ── */
    .missing-cta {
      margin-top: 28px;
      padding: 18px 22px;
      background: rgba(128,0,0,.04);
      border: 1px solid rgba(128,0,0,.15);
      border-radius: 6px;
    }
    .missing-cta h3 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: #800000;
      margin: 0 0 8px 0;
    }
    .missing-cta p {
      font-size: .85rem;
      color: #555;
      line-height: 1.55;
      margin: 0 0 12px 0;
    }
    .missing-cta-btn {
      display: inline-block;
      padding: 7px 16px;
      background: #800000;
      color: #fff;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: .82rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s;
    }
    .missing-cta-btn:hover {
      background: #a00000;
    }

    /* ── RECURRING EVENTS (herhalende activiteiten samengevat) ── */
    .event-card-recurring {
      background: linear-gradient(90deg, rgba(128,0,0,.04) 0%, #fff 40%);
      border-color: rgba(128,0,0,.15);
    }
    .event-date-recurring {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
    }
    .event-date-recurring .day-name {
      font-size: 1rem;
      font-weight: 700;
      color: #800000;
      letter-spacing: 0;
    }

    /* ── EVENT BODY ── */
    .event-body { flex: 1; min-width: 0; }
    .event-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: .85rem;
      color: #2a2a2a;
      margin-bottom: 1px;
      line-height: 1.3;
    }
    .event-meta {
      font-size: .72rem;
      color: #888;
      line-height: 1.4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px;
    }
    .event-meta .separator {
      margin: 0 4px;
      color: #ccc;
    }
    .type-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: .62rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    /* ── LINK WRAPPER ── */
    a.event-card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    a.event-card-link .event-card { cursor: pointer; }
    a.event-card-link:hover .event-card {
      box-shadow: 0 3px 12px rgba(128,0,0,.12);
      border-color: rgba(128,0,0,.3);
    }
    a.event-card-link:focus {
      outline: 2px solid #800000;
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* ── VERENIGINGEN TAB ── */
    .ver-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .ver-card {
      background: #fff;
      border: 1px solid #e8e0d8;
      border-radius: 6px;
      padding: 16px;
      transition: box-shadow .2s;
      display: flex;
      flex-direction: column;
    }
    .ver-card:hover {
      box-shadow: 0 2px 10px rgba(128,0,0,.08);
    }
    .ver-card-stil {
      background: #fafafa;
      border-color: #ececec;
    }
    .ver-card h3 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: .95rem;
      color: #800000;
      margin-bottom: 4px;
    }
    .ver-abbr {
      font-size: .75rem;
      color: #888;
      margin-bottom: 8px;
    }
    .ver-detail {
      font-size: .8rem;
      color: #555;
      margin-bottom: 3px;
    }
    .ver-beschrijving {
      font-size: .78rem;
      color: #666;
      margin-bottom: .4rem;
      line-height: 1.5;
    }
    .ver-events-count {
      color: #800000;
      font-weight: 500;
    }
    .ver-buttons {
      margin-top: auto;
      padding-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ver-link {
      display: inline-block;
      font-size: .78rem;
      font-weight: 600;
      color: #fff;
      background: #800000;
      padding: 5px 11px;
      border-radius: 3px;
      text-decoration: none;
      transition: background .15s;
    }
    .ver-link:hover {
      background: #a00000;
      text-decoration: none;
    }
    .ver-link-contact {
      background: transparent;
      color: #800000;
      border: 1px solid #800000;
      padding: 4px 10px;
    }
    .ver-link-contact:hover {
      background: rgba(128,0,0,.08);
      color: #800000;
    }
    .ver-geen-info {
      font-size: .72rem;
      color: #aaa;
      font-style: italic;
    }

    /* ── ZONDER EVENTS ── */
    .zonder-events { margin-top: 28px; }
    .zonder-events h2 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: #800000;
      margin-bottom: 6px;
    }
    .zonder-subtitle {
      font-size: .85rem;
      color: #666;
      margin-bottom: 12px;
      font-style: italic;
    }
    .zonder-list {
      list-style: none;
      padding: 0;
    }
    .zonder-list li {
      padding: 8px 12px;
      border-bottom: 1px solid #e8e0d8;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: baseline;
    }
    .zonder-list li:last-child { border-bottom: none; }
    .zl-name {
      font-weight: 600;
      font-size: .85rem;
      color: #2a2a2a;
    }
    .zl-info {
      font-size: .8rem;
      color: #888;
    }

    /* ── META ── */
    .meta-info {
      margin-top: 24px;
      padding: 12px 16px;
      background: rgba(128,0,0,.05);
      border-radius: 6px;
      font-size: .78rem;
      color: #888;
    }
    .meta-info strong { color: #800000; }

    /* ── CTA ── */
    .cta-block {
      background: #800000;
      color: #fff;
      padding: 2rem;
      border-radius: 6px;
      margin-top: 2rem;
      text-align: center;
    }
    .cta-block h2 {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      font-size: 1.3rem;
      margin-bottom: .6rem;
    }
    .cta-block p {
      font-family: 'Mulish', sans-serif;
      font-size: .95rem;
      line-height: 1.8em;
      margin-bottom: 1rem;
    }
    .cta-block .cta-btn {
      display: inline-block;
      background: #fff;
      color: #800000;
      font-family: 'Mulish', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      padding: .7rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      transition: background .2s;
    }
    .cta-block .cta-btn:hover { background: #f0ece8; }

    /* ── EMPTY / LOADING ── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
      font-size: .9rem;
    }
    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #888;
    }
    .spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid rgba(128,0,0,.15);
      border-top-color: #800000;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE ── */
    @media (max-width: 540px) {
      .filters { flex-direction: column; }
      .filter-group { min-width: 100%; }
      .site-header h1 { font-size: 1.2rem; }
      .tab-btn { padding: 8px 14px; font-size: .82rem; }
      .ver-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="site-header">
    <h1>Verenigingen &amp; Evenementen</h1>
    <p>Nederlandstalige gemeenschap in Frankrijk <span class="versie">v2026-04-19</span></p>
  </div>

  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="evenementen">Evenementenkalender</button>
    <button class="tab-btn" data-tab="verenigingen">Verenigingen</button>
  </div>

  <!-- TAB: EVENEMENTEN -->
  <div id="tab-evenementen" class="tab-panel active">

    <div class="filters">
      <div class="filter-group">
        <label for="filter-regio">Regio</label>
        <select id="filter-regio">
          <option value="">Alle regio's</option>
        </select>
      </div>
      <!-- Vereniging filter wordt hier dynamisch ingevoegd door JS -->
      <div class="filter-group">
        <label for="filter-maand">Maand</label>
        <select id="filter-maand">
          <option value="">Alle maanden</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-type">Type</label>
        <select id="filter-type">
          <option value="">Alle types</option>
          <option value="sociaal">Sociaal</option>
          <option value="sportief">Sportief</option>
          <option value="cultureel">Cultureel</option>
          <option value="informatief">Informatief</option>
          <option value="bestuurlijk">Bestuurlijk</option>
          <option value="zakelijk">Zakelijk</option>
          <option value="kerkdienst">Kerkdienst</option>
        </select>
      </div>
    </div>

    <div id="kalender-content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Evenementen laden&hellip;</div>
      </div>
    </div>
  </div>

  <!-- TAB: VERENIGINGEN -->
  <div id="tab-verenigingen" class="tab-panel">
    <div id="verenigingen-content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Verenigingen laden&hellip;</div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var TYPE_KLEUREN = {
    sociaal:      '#800000',
    sportief:     '#a0522d',
    cultureel:    '#4a1a2e',
    informatief:  '#2d5a3d',
    bestuurlijk:  '#555',
    zakelijk:     '#1a3a5c',
    kerkdienst:   '#5c4a1a'
  };

  var MAANDEN_NL = [
    'januari','februari','maart','april','mei','juni',
    'juli','augustus','september','oktober','november','december'
  ];

  var DAGEN_NL = ['zo','ma','di','wo','do','vr','za'];

  var alleVerenigingen = [];
  var alleEvents = [];

  var kalenderContent     = document.getElementById('kalender-content');
  var verenigingenContent = document.getElementById('verenigingen-content');
  var filterRegio         = document.getElementById('filter-regio');
  var filterMaand         = document.getElementById('filter-maand');
  var filterType          = document.getElementById('filter-type');

  var filterVereniging = createVerenigingFilter();

  initTabs();
  loadData();

  // ── VERENIGING FILTER (dynamisch toegevoegd tussen Regio en Type) ──
  function createVerenigingFilter() {
    var filterGroup = document.createElement('div');
    filterGroup.className = 'filter-group';

    var label = document.createElement('label');
    label.setAttribute('for', 'filter-vereniging');
    label.textContent = 'Vereniging';
    filterGroup.appendChild(label);

    var select = document.createElement('select');
    select.id = 'filter-vereniging';

    var defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.textContent = 'Alle verenigingen';
    select.appendChild(defaultOpt);

    filterGroup.appendChild(select);

    var filterTypeGroup = filterType.parentElement;
    filterTypeGroup.parentElement.insertBefore(filterGroup, filterTypeGroup);

    return select;
  }

  // ── TABS ──
  function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });
  }

  // ── DATA LADEN ──
  function loadData() {
    // Cache-busting: voeg timestamp toe zodat browser/CDN geen oude JSON serveert
    fetch('data/verenigingen.json?t=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        alleVerenigingen = data.verenigingen || [];
        buildEventsFromVerenigingen();
        populateRegioFilter();
        populateVerenigingFilter();
        populateMaandFilter();
        renderKalender();
        renderVerenigingen(data.meta);
      })
      .catch(function (err) {
        kalenderContent.innerHTML = '<div class="empty-state"><p>Fout bij laden: ' + escapeHtml(err.message) + '</p></div>';
        verenigingenContent.innerHTML = kalenderContent.innerHTML;
      });
  }

  // ── EVENTS OPBOUWEN UIT VERENIGINGEN ──
  function buildEventsFromVerenigingen() {
    alleEvents = [];
    alleVerenigingen.forEach(function (ver) {
      if (!ver.events) return;
      ver.events.forEach(function (ev) {
        alleEvents.push({
          titel:      ev.titel,
          datum:      ev.datum,
          tijd:       ev.tijd || '',
          plaats:     ev.plaats || '',
          type:       ev.type || 'sociaal',
          vereniging: ver.naam,
          afkorting:  ver.afkorting || '',
          regio:      ver.regio || '',
          bron:       ev.bron || '',
          agenda_url: ver.agenda_url || '',
          website:    ver.website || ''
        });
      });
    });
  }

  // ── REGIO FILTER VULLEN ──
  function populateRegioFilter() {
    var regios = [];
    alleVerenigingen.forEach(function (ver) {
      if (ver.regio && regios.indexOf(ver.regio) === -1) {
        regios.push(ver.regio);
      }
    });
    regios.sort();
    regios.forEach(function (r) {
      var opt = document.createElement('option');
      opt.value = r;
      opt.textContent = r;
      filterRegio.appendChild(opt);
    });
    filterRegio.addEventListener('change', renderKalender);
    filterType.addEventListener('change', renderKalender);
  }

  // ── VERENIGING FILTER VULLEN ──
  function populateVerenigingFilter() {
    var namen = [];
    alleVerenigingen.forEach(function (ver) {
      if (ver.events && ver.events.length > 0 && namen.indexOf(ver.naam) === -1) {
        namen.push(ver.naam);
      }
    });
    namen.sort();
    namen.forEach(function (n) {
      var opt = document.createElement('option');
      opt.value = n;
      opt.textContent = n;
      filterVereniging.appendChild(opt);
    });
    filterVereniging.addEventListener('change', renderKalender);
  }

  // ── MAAND FILTER VULLEN ──
  function populateMaandFilter() {
    var now = new Date();
    now.setHours(0, 0, 0, 0);

    var maanden = [];
    alleEvents.forEach(function (ev) {
      var d = new Date(ev.datum);
      if (d < now) return;
      var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      if (maanden.indexOf(key) === -1) maanden.push(key);
    });
    maanden.sort();
    maanden.forEach(function (key) {
      var parts = key.split('-');
      var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = capitalize(MAANDEN_NL[d.getMonth()] + ' ' + d.getFullYear());
      filterMaand.appendChild(opt);
    });
    filterMaand.addEventListener('change', renderKalender);
  }

  // ── KALENDER RENDEREN ──
  function renderKalender() {
    var now = new Date();
    now.setHours(0, 0, 0, 0);

    var regio      = filterRegio.value;
    var type       = filterType.value;
    var vereniging = filterVereniging.value;
    var maand      = filterMaand.value;

    var filtered = alleEvents.filter(function (ev) {
      var evDate = new Date(ev.datum);
      if (evDate < now) return false;
      if (regio && ev.regio !== regio) return false;
      if (type && ev.type !== type) return false;
      if (vereniging && ev.vereniging !== vereniging) return false;
      if (maand) {
        var evKey = evDate.getFullYear() + '-' + String(evDate.getMonth() + 1).padStart(2, '0');
        if (evKey !== maand) return false;
      }
      return true;
    });

    filtered.sort(function (a, b) {
      return new Date(a.datum) - new Date(b.datum);
    });

    if (filtered.length === 0) {
      kalenderContent.innerHTML = '<div class="empty-state"><p>Geen toekomstige evenementen gevonden voor deze selectie.</p></div>';
      return;
    }

    var groups = {};
    filtered.forEach(function (ev) {
      var d = new Date(ev.datum);
      var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      if (!groups[key]) {
        groups[key] = {
          label: MAANDEN_NL[d.getMonth()] + ' ' + d.getFullYear(),
          events: []
        };
      }
      groups[key].events.push(ev);
    });

    var html = '';
    Object.keys(groups).sort().forEach(function (key) {
      var g = groups[key];
      var merged = mergeRecurringEvents(g.events);
      html += '<div class="month-group">';
      html += '<h2>' + capitalize(g.label) + '</h2>';
      merged.forEach(function (item) {
        if (item.isRecurring) {
          html += buildRecurringCard(item);
        } else {
          html += buildEventCard(item);
        }
      });
      html += '</div>';
    });

    kalenderContent.innerHTML = html + buildMissingVerenigingCTA();
  }

  // ── CTA: verenigingen zonder online agenda ──
  function buildMissingVerenigingCTA() {
    return '' +
      '<div class="missing-cta">' +
      '<h3>Mist u een vereniging?</h3>' +
      '<p>Niet alle Nederlandse verenigingen in Frankrijk publiceren hun activiteiten online in een formaat dat automatisch kan worden opgehaald. Bekijk het tabblad Verenigingen voor een compleet overzicht. Staat uw vereniging er niet bij, of klopt de informatie niet? Neem dan contact op.</p>' +
      '<button type="button" class="missing-cta-btn" onclick="document.querySelector(\'.tab-btn[data-tab=&quot;verenigingen&quot;]\').click(); window.scrollTo({top:0,behavior:\'smooth\'});">Bekijk alle verenigingen</button>' +
      '</div>';
  }

  // ── TERUGKERENDE EVENTS GROEPEREN ──
  // Events met dezelfde vereniging + titel + type in dezelfde maand (3+ keer)
  // worden samengevoegd tot één compacte regel met alle datums.
  function mergeRecurringEvents(events) {
    var buckets = {};
    var order = [];

    events.forEach(function (ev) {
      // Normaliseer titel voor matching (case-insensitive, trim)
      var titelKey = (ev.titel || '').toLowerCase().trim();
      var key = ev.vereniging + '||' + titelKey + '||' + ev.type;
      if (!buckets[key]) {
        buckets[key] = {
          vereniging: ev.vereniging,
          afkorting:  ev.afkorting,
          titel:      ev.titel,
          type:       ev.type,
          regio:      ev.regio,
          bron:       ev.bron,
          agenda_url: ev.agenda_url,
          website:    ev.website,
          events:     []
        };
        order.push(key);
      }
      buckets[key].events.push(ev);
    });

    var result = [];
    order.forEach(function (key) {
      var bucket = buckets[key];
      if (bucket.events.length >= 3) {
        bucket.isRecurring = true;
        bucket.events.sort(function (a, b) {
          return new Date(a.datum) - new Date(b.datum);
        });
        result.push(bucket);
      } else {
        bucket.events.forEach(function (ev) { result.push(ev); });
      }
    });

    // Sorteer: enkelvoudige events op datum, recurring items bij eerste datum
    result.sort(function (a, b) {
      var aDate = a.isRecurring ? new Date(a.events[0].datum) : new Date(a.datum);
      var bDate = b.isRecurring ? new Date(b.events[0].datum) : new Date(b.datum);
      return aDate - bDate;
    });

    return result;
  }

  // ── RECURRING CARD ──
  function buildRecurringCard(item) {
    var bgColor = TYPE_KLEUREN[item.type] || '#800000';
    var href = item.bron || item.agenda_url || item.website;
    var count = item.events.length;

    // Lijstje datums: "1, 5, 8, 12, 15..."
    var dagen = item.events.map(function (ev) {
      return new Date(ev.datum).getDate();
    }).join(', ');

    var card = '';
    if (href) {
      card += '<a class="event-card-link" href="' + escapeHtml(href) + '" target="_blank" rel="noopener">';
    }
    card += '<div class="event-card event-card-recurring">';
    card += '<div class="event-date event-date-recurring">';
    card += '<span class="day-name">' + count + '×</span>';
    card += '</div>';
    card += '<div class="event-body">';
    card += '<div class="event-title">' + escapeHtml(item.titel) + '</div>';
    card += '<div class="event-meta">';
    card += '<span class="type-badge" style="background:' + bgColor + '">' + escapeHtml(item.type) + '</span>';
    card += '<span class="separator">|</span>';
    card += '<span>' + escapeHtml(item.afkorting || item.vereniging) + '</span>';
    card += '<span class="separator">|</span>';
    card += '<span>op ' + dagen + '</span>';
    card += '</div>';
    card += '</div>';
    card += '</div>';
    if (href) {
      card += '</a>';
    }
    return card;
  }

  // ── EVENT CARD ──
  function buildEventCard(ev) {
    var d = new Date(ev.datum);
    var dagNaam  = DAGEN_NL[d.getDay()];
    var dagNum   = d.getDate();
    var maand    = MAANDEN_NL[d.getMonth()].substring(0, 3);
    var bgColor  = TYPE_KLEUREN[ev.type] || '#800000';

    var href = ev.bron || ev.agenda_url || ev.website;

    var card = '';
    if (href) {
      card += '<a class="event-card-link" href="' + escapeHtml(href) + '" target="_blank" rel="noopener">';
    }
    card += '<div class="event-card">';
    card += '<div class="event-date">';
    card += '<span class="day-name">' + dagNaam + '</span>';
    card += '<span class="day-num">' + dagNum + '</span>';
    card += '<span class="month-name">' + maand + '</span>';
    card += '</div>';
    card += '<div class="event-body">';
    card += '<div class="event-title">' + escapeHtml(ev.titel) + '</div>';
    card += '<div class="event-meta">';
    card += '<span class="type-badge" style="background:' + bgColor + '">' + escapeHtml(ev.type) + '</span>';
    card += '<span class="separator">|</span>';
    card += '<span>' + escapeHtml(ev.afkorting || ev.vereniging) + '</span>';
    if (ev.plaats) {
      card += '<span class="separator">|</span>';
      card += '<span>' + escapeHtml(ev.plaats) + '</span>';
    }
    if (ev.tijd) {
      card += '<span class="separator">|</span>';
      card += '<span>' + escapeHtml(ev.tijd) + '</span>';
    }
    card += '</div>';
    card += '</div>';
    card += '</div>';
    if (href) {
      card += '</a>';
    }
    return card;
  }

  // ── VERENIGINGEN RENDEREN ──
  function renderVerenigingen(meta) {
    // Sorteer: verenigingen met events eerst (op naam), daarna zonder (op naam)
    var sorted = alleVerenigingen.slice().sort(function (a, b) {
      var aHeeft = (a.events && a.events.length > 0) ? 0 : 1;
      var bHeeft = (b.events && b.events.length > 0) ? 0 : 1;
      if (aHeeft !== bHeeft) return aHeeft - bHeeft;
      return a.naam.localeCompare(b.naam);
    });

    var html = '';
    html += '<div class="ver-grid">';
    sorted.forEach(function (ver) {
      html += buildVerenigingCard(ver);
    });
    html += '</div>';

    if (meta) {
      html += '<div class="meta-info">';
      html += '<strong>Laatste update:</strong> ' + escapeHtml(meta.laatst_bijgewerkt || 'onbekend');
      html += ' &nbsp;&bull;&nbsp; ';
      html += '<strong>Bronnen gecontroleerd:</strong> ' + (meta.bronnen_gecontroleerd || '?');
      html += ' &nbsp;&bull;&nbsp; ';
      html += '<strong>Totaal events:</strong> ' + (meta.totaal_events || '?');
      html += '</div>';
    }

    html += '<div class="cta-block">';
    html += '<h2>Uw vereniging toevoegen?</h2>';
    html += '<p>Organiseert uw vereniging activiteiten voor Nederlandstaligen in Frankrijk? Wij nemen uw evenementen graag op in dit overzicht.</p>';
    html += '<a class="cta-btn" href="mailto:info@nederlanders.fr">Contact opnemen</a>';
    html += '</div>';

    verenigingenContent.innerHTML = html;
  }

  // ── VERENIGING-CARD ──
  function buildVerenigingCard(ver) {
    var eventCount = (ver.events && ver.events.length) || 0;
    var heeftEvents = eventCount > 0;

    // Detecteer website-type voor passende knop-tekst
    var isFacebook = ver.website && /facebook\.com/i.test(ver.website);
    var websiteLabel = isFacebook ? 'Facebook-pagina' : 'Website bezoeken';

    var cardClass = heeftEvents ? 'ver-card' : 'ver-card ver-card-stil';
    var html = '<div class="' + cardClass + '">';
    html += '<h3>' + escapeHtml(ver.naam) + '</h3>';

    if (ver.afkorting && ver.afkorting !== ver.naam) {
      html += '<div class="ver-abbr">' + escapeHtml(ver.afkorting) + '</div>';
    }
    if (ver.regio) {
      html += '<div class="ver-detail"><strong>Regio:</strong> ' + escapeHtml(ver.regio) + '</div>';
    }
    if (ver.opmerking) {
      html += '<div class="ver-beschrijving">' + escapeHtml(ver.opmerking) + '</div>';
    }
    if (heeftEvents) {
      html += '<div class="ver-detail ver-events-count"><strong>Evenementen:</strong> ' + eventCount + ' gepland</div>';
    }

    // Knoppen
    html += '<div class="ver-buttons">';
    if (ver.website) {
      html += '<a class="ver-link" href="' + escapeHtml(ver.website) + '" target="_blank" rel="noopener">' + websiteLabel + ' &rarr;</a>';
    }
    if (ver.contact) {
      html += '<a class="ver-link ver-link-contact" href="mailto:' + escapeHtml(ver.contact) + '">Contact opnemen</a>';
    }
    if (!ver.website && !ver.contact) {
      html += '<span class="ver-geen-info">Geen contactgegevens beschikbaar</span>';
    }
    html += '</div>';

    html += '</div>';
    return html;
  }

  // ── HELPERS ──
  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str)));
    return div.innerHTML;
  }

  function capitalize(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

})();
</script>
