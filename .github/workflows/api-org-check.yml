name: API-organisatie controleren
# Handmatig. Toont bij welke Anthropic-organisatie de sleutel ANTHROPIC_API_KEY hoort
# (header anthropic-organization-id) en of de uitgavengrens bereikt is.
# Gebruikt het gratis count_tokens-eindpunt: kost niets.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Organisatie en status
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "--- count_tokens (gratis) ---"
          curl -sS -D - -o body.txt https://api.anthropic.com/v1/messages/count_tokens \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
            -d '{"model":"claude-sonnet-4-6","messages":[{"role":"user","content":"test"}]}' | grep -iE "^HTTP|anthropic-organization-id" || true
          cat body.txt; echo
