name: Bronnentest Cercle Néerlandais

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Haal startpagina en activiteitenpagina's op
        run: |
          UA="Mozilla/5.0 (compatible; VerenigingenKalender/1.0)"
          BASE="https://www.cercleneerlandais.com"
          echo "Runner IP: $(curl -s https://api.ipify.org)"
          for P in "" aanmelden-kaas--en-wijnavond.html info-kindermiddag.html info-kookatelier.html aanmelden-sinterklaasfeest.html sinterkerstborrel.html; do
            URL="$BASE/$P"
            curl -sS -A "$UA" -D h.txt -o b.html -w "" --max-time 30 "$URL" || echo "CURL FOUT: $?"
            STATUS=$(head -1 h.txt 2>/dev/null | tr -d '\r')
            hdr() { grep -i "^$1:" h.txt 2>/dev/null | head -1 | cut -d: -f2- | tr -d '\r' | xargs; }
            CHAL=nee; grep -qiE "Just a moment|cf-chl" b.html 2>/dev/null && CHAL=JA
            CAL=nee; grep -q "🗓" b.html 2>/dev/null && CAL=ja
            echo "$URL | status: $STATUS | server: $(hdr server) | cf-ray: $(hdr cf-ray) | cf-mitigated: $(hdr cf-mitigated) | challenge: $CHAL | 🗓: $CAL | bytes: $(wc -c < b.html 2>/dev/null)"
            rm -f h.txt b.html
            sleep 2
          done
