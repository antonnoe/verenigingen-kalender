name: Verenigingen Kalender Update

on:
  schedule:
    # Maandag, woensdag en vrijdag om 07:00 UTC (09:00 Franse tijd)
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:
    # Handmatig triggeren via GitHub Actions tab

permissions:
  contents: write
  issues: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installeer dependencies
        working-directory: scripts
        run: npm install

      - name: Voer update-script uit
        id: update
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node update-events.js 2>&1 | tee output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Controleer op wijzigingen
        id: changes
        run: |
          # health.json krijgt elke run een nieuwe heartbeat-timestamp, dus er is
          # vrijwel altijd iets te committen (gewenst: dat is de heartbeat).
          git diff --quiet data/verenigingen.json data/health.json data/nieuws.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit en push wijzigingen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/verenigingen.json data/health.json data/nieuws.json
          DATUM=$(date +%Y-%m-%d)
          git commit -m "Automatische update evenementen ${DATUM}"
          git pull --rebase origin main
          git push

      - name: Maak Issue aan bij waarschuwingen
        if: steps.update.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATUM=$(date +%Y-%m-%d)
          
          # Bouw issue body
          BODY="## ⚠️ Kalender Update Waarschuwingen — ${DATUM}\n\n"
          BODY+="De geplande update is uitgevoerd maar een of meer bronnen gaven fouten.\n\n"
          BODY+="**Lees eerst het veld 'diagnose' per bron hieronder.** Daarin staat de oorzaak-categorie "
          BODY+="(verplaatst/geblokkeerd/netwerk/formaat/ai/intern) met uitleg en advies. Categorieen als "
          BODY+="*verplaatst* en *formaat* betekenen dat de vereniging haar site heeft gewijzigd - dat is "
          BODY+="geen bug in dit script. Alleen categorie *intern* wijst op een mogelijke scriptbug. "
          BODY+="Eerder opgehaalde events blijven zichtbaar (veld 'events_behouden').\n\n"
          
          if [ -f scripts/warnings.json ]; then
            BODY+="### Bronnen met fouten:\n\n"
            BODY+="\`\`\`json\n"
            BODY+="$(cat scripts/warnings.json)\n"
            BODY+="\`\`\`\n\n"
          fi
          
          BODY+="### Volledige log:\n\n"
          BODY+="\`\`\`\n"
          BODY+="$(cat scripts/output.log)\n"
          BODY+="\`\`\`\n\n"
          BODY+="---\n"
          BODY+="*Dit issue is automatisch aangemaakt door de Kalender Update workflow.*"
          
          gh issue create \
            --title "⚠️ Kalender bronnen omgevallen — ${DATUM}" \
            --body "$(echo -e "$BODY")"

      - name: Maak Issue aan bij fatale fout
        if: steps.update.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATUM=$(date +%Y-%m-%d)
          
          BODY="## 🔴 Kalender Update FATALE FOUT — ${DATUM}\n\n"
          BODY+="Het update-script is volledig gecrasht.\n\n"
          BODY+="### Log:\n\n"
          BODY+="\`\`\`\n"
          BODY+="$(cat scripts/output.log)\n"
          BODY+="\`\`\`\n\n"
          BODY+="---\n"
          BODY+="*Dit issue is automatisch aangemaakt door de Kalender Update workflow.*"
          
          gh issue create \
            --title "🔴 Kalender update FATAAL GECRASHT — ${DATUM}" \
            --body "$(echo -e "$BODY")"
